<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — FabForm</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plausible Analytics -->
  <script async src="https://plausible.io/js/pa-eUpUk2tYkw3NjxEftxVvm.js"></script>
  <script>
    window.plausible = window.plausible || function(){(plausible.q = plausible.q || []).push(arguments)};
  </script>
</head>

<body class="bg-slate-900 text-slate-100 antialiased">

<!-- NAVIGATION -->
<header class="sticky top-0 z-50 bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-700 backdrop-blur">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a href="/" class="text-white font-extrabold text-2xl tracking-wide">
        FabForm.io
      </a>

      <!-- Desktop Menu -->
      <nav class="hidden md:flex items-center space-x-6 text-white font-medium">
        <a href="https://blog.fabform.io" class="px-3 py-2 rounded-lg hover:bg-white/10 transition">Blog</a>
        <a href="/pricing" class="px-3 py-2 rounded-lg hover:bg-white/10 transition">Pricing</a>
        <a href="https://docs.fabform.io" class="px-3 py-2 rounded-lg hover:bg-white/10 transition">Documentation</a>
        <a href="/contact" class="px-3 py-2 rounded-lg hover:bg-white/10 transition">Contact</a>
      </nav>

      <!-- Auth Buttons -->
      <div class="hidden md:flex items-center space-x-4">
        <a href="https://app.fabform.io/login" 
           class="px-5 py-2 rounded-lg bg-white text-indigo-700 font-semibold shadow hover:bg-indigo-100 transition">
          Login
        </a>
        <a href="https://app.fabform.io/signup" 
           class="px-5 py-2 rounded-lg bg-pink-500 text-white font-semibold shadow hover:bg-pink-600 transition">
          Sign Up
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button id="menu-toggle" class="md:hidden text-white focus:outline-none">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-slate-900 px-6 pb-6">
    <nav class="space-y-4 text-white font-medium">
      <a href="https://blog.fabform.io" class="block px-3 py-2 rounded-lg hover:bg-white/10 transition">Blog</a>
      <a href="/pricing" class="block px-3 py-2 rounded-lg hover:bg-white/10 transition">Pricing</a>
      <a href="/contact" class="block px-3 py-2 rounded-lg hover:bg-white/10 transition">Contact</a>
      <a href="https://app.fabform.io/login" 
         class="block px-5 py-2 rounded-lg bg-white text-indigo-700 font-semibold shadow hover:bg-indigo-100 transition">
        Login
      </a>
      <a href="https://app.fabform.io/signup" 
         class="block px-5 py-2 rounded-lg bg-pink-500 text-white font-semibold shadow hover:bg-pink-600 transition">
        Sign Up
      </a>
    </nav>
  </div>
</header>

<script>
  document.getElementById('menu-toggle').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  });
</script>

<!-- CONTACT FORM -->
<section class="py-20 px-6">
  <div class="max-w-2xl mx-auto bg-white text-gray-900 shadow-2xl rounded-2xl p-10">

    <h1 class="text-4xl font-bold mb-6 text-center">Get in Touch</h1>
    <p class="text-gray-600 text-center mb-10">
      Have a question about FabForm? Want to collaborate?  
      Send us a message and we’ll get back to you quickly.
    </p>

    <form action="https://fabform.io/f/JKOkjBT" method="POST" class="space-y-6">

      <!-- Name -->
      <div>
        <label class="block text-sm font-semibold mb-1">Name</label>
        <input
          type="text"
          name="name"
          required
          placeholder="Your name"
          class="w-full border border-gray-300 rounded-lg p-3 text-black bg-gray-50 focus:ring-blue-600 focus:border-blue-600"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          placeholder="you@example.com"
          class="w-full border border-gray-300 rounded-lg p-3 text-black bg-gray-50 focus:ring-blue-600 focus:border-blue-600"
        />
      </div>

      <!-- Message -->
      <div>
        <label class="block text-sm font-semibold mb-1">Message</label>
        <textarea
          name="message"
          rows="6"
          required
          placeholder="How can we help?"
          class="w-full border border-gray-300 rounded-lg p-3 text-black bg-gray-50 focus:ring-blue-600 focus:border-blue-600"
        ></textarea>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
      >
        Send Message
      </button>
    </form>
  </div>
</section>

<!-- Footer -->
<footer class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 py-10">
  <div class="max-w-6xl mx-auto px-6 text-center text-sm text-white">
    &copy; <span id="year"></span> FabForm.io — Form Backend Service for Static WebSites 
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
